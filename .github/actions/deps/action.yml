# Node from .nvmrc and node_modules restored from a cache keyed on the lockfile: `npm ci` only runs when
# dependencies change (it was ~50 s in every job).
name: Install dependencies
description: Set up Node and node_modules, cached by package-lock.json
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with: { node-version-file: .nvmrc }
    - id: modules
      uses: actions/cache@v4
      with:
        path: node_modules
        key: node-modules-${{ runner.os }}-${{ hashFiles('.nvmrc', 'package-lock.json') }}
    - if: steps.modules.outputs.cache-hit != 'true'
      shell: bash
      run: npm ci --prefer-offline --no-audit --no-fund
